<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Happy Birthday, Sara — A Night Above the City</title>
    <meta name="description" content="An extraordinary rooftop birthday celebration beneath a glittering dream skyline.">
    <meta property="og:title" content="Happy Birthday, Sara ✦">
    <meta property="og:description" content="Tonight, the whole skyline shines for you.">
    <meta property="og:image" content="https://sarasix.github.io/assets/img/birthday/rooftop-proposal-og.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Happy Birthday, Sara ✦">
    <meta name="twitter:description" content="Tonight, the whole skyline shines for you.">
    <meta name="twitter:image" content="https://sarasix.github.io/assets/img/birthday/rooftop-proposal-og.png">
    <link rel="icon" href="/assets/img/birthday/sara-photo.jpg">
    <style>
      :root {
        color-scheme: dark;
        --champagne: #f8d99a;
        --ivory: #fff9ed;
        --rose: #f1a7b8;
        --midnight: #020611;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--midnight);
      }

      body {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      body:active {
        cursor: grabbing;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .vignette,
      .film-grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      .vignette {
        background:
          radial-gradient(circle at 50% 48%, transparent 48%, rgba(1, 4, 13, 0.38) 78%, rgba(1, 3, 10, 0.8) 100%),
          linear-gradient(180deg, rgba(2, 6, 20, 0.14), transparent 34%, rgba(2, 4, 12, 0.28));
      }

      .film-grain {
        opacity: 0.05;
        mix-blend-mode: screen;
        background-image:
          repeating-radial-gradient(circle at 17% 31%, rgba(255,255,255,.52) 0 0.35px, transparent 0.7px 3px),
          repeating-radial-gradient(circle at 71% 63%, rgba(255,255,255,.3) 0 0.3px, transparent 0.6px 4px);
        background-size: 7px 9px, 11px 13px;
      }

      .hero-copy {
        position: fixed;
        top: max(28px, env(safe-area-inset-top));
        left: clamp(22px, 4vw, 64px);
        z-index: 5;
        color: var(--ivory);
        pointer-events: none;
        text-shadow: 0 2px 28px rgba(0, 0, 0, 0.65);
      }

      .eyebrow {
        margin: 0 0 9px;
        color: var(--champagne);
        font-size: clamp(9px, 0.8vw, 12px);
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(30px, 4.8vw, 72px);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 0.92;
      }

      h1 em {
        display: block;
        color: var(--champagne);
        font-weight: 400;
      }

      .subtitle {
        margin: 15px 0 0;
        max-width: 340px;
        color: rgba(255, 249, 237, 0.72);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(12px, 1.1vw, 16px);
        font-style: italic;
        letter-spacing: 0.04em;
      }

      .experience-bar {
        position: fixed;
        right: clamp(18px, 3vw, 44px);
        bottom: max(22px, env(safe-area-inset-bottom));
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .hint {
        color: rgba(255, 249, 237, 0.56);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 2px 12px #000;
      }

      .wish-button {
        position: relative;
        min-width: 154px;
        overflow: hidden;
        border: 1px solid rgba(248, 217, 154, 0.5);
        border-radius: 999px;
        padding: 13px 21px;
        background: linear-gradient(135deg, rgba(28, 23, 48, 0.82), rgba(104, 62, 76, 0.68));
        box-shadow: 0 14px 50px rgba(0, 0, 0, 0.35), inset 0 1px rgba(255, 255, 255, 0.12);
        color: var(--ivory);
        cursor: pointer;
        font: 700 11px/1 Inter, ui-sans-serif, sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .wish-button::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 22%, rgba(255,255,255,.25) 48%, transparent 72%);
        content: "";
        transform: translateX(-130%);
        transition: transform 700ms ease;
      }

      .wish-button:hover,
      .wish-button:focus-visible {
        border-color: rgba(248, 217, 154, 0.96);
        box-shadow: 0 16px 58px rgba(0, 0, 0, 0.48), 0 0 28px rgba(248, 217, 154, 0.14);
        outline: none;
        transform: translateY(-2px);
      }

      .wish-button:hover::before {
        transform: translateX(130%);
      }

      .loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 44%, #15223d 0, #060a16 44%, #01030a 100%);
        color: var(--ivory);
        transition: opacity 900ms ease, visibility 900ms ease;
      }

      .loader.is-hidden {
        visibility: hidden;
        opacity: 0;
      }

      .loader-inner {
        text-align: center;
      }

      .loader-star {
        display: block;
        margin-bottom: 18px;
        color: var(--champagne);
        font-size: 36px;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .loader p {
        margin: 0;
        color: rgba(255,255,255,.7);
        font-family: Georgia, serif;
        font-size: 16px;
        font-style: italic;
        letter-spacing: .08em;
      }

      @keyframes pulse {
        50% { opacity: .38; transform: scale(.84) rotate(18deg); }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 720px) {
        .hero-copy {
          top: max(19px, env(safe-area-inset-top));
          left: 20px;
        }

        .subtitle {
          margin-top: 9px;
          max-width: 245px;
          font-size: 11px;
        }

        .experience-bar {
          right: 16px;
          bottom: max(16px, env(safe-area-inset-bottom));
        }

        .hint {
          display: none;
        }

        .wish-button {
          min-width: 136px;
          padding: 12px 17px;
          font-size: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-star { animation: none; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="film-grain"></div>

    <header class="hero-copy">
      <p class="eyebrow">A private rooftop · Manhattan after midnight</p>
      <h1>Happy Birthday, <em>Sara</em></h1>
      <p class="subtitle">Tonight, the whole skyline shines for you.</p>
    </header>

    <div class="experience-bar">
      <span class="hint">Drag to explore · Scroll to move closer</span>
      <button class="wish-button" id="wishButton" type="button" aria-label="Make a birthday wish">
        Make a wish&nbsp; ✦
      </button>
    </div>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <span class="loader-star">✦</span>
        <p>Lighting the skyline for Sara…</p>
      </div>
    </div>

    <h2 class="sr-only">An interactive 3D rooftop birthday celebration for Sara</h2>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { EffectComposer } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js";

      const canvas = document.querySelector("#scene");
      const loader = document.querySelector("#loader");
      const wishButton = document.querySelector("#wishButton");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.96;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x01040d);
      scene.fog = new THREE.FogExp2(0x061020, 0.021);

      const camera = new THREE.PerspectiveCamera(47, 1, 0.1, 140);
      camera.position.set(0.45, 4.15, 11.8);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 2.05, -0.2);
      controls.enableDamping = true;
      controls.dampingFactor = 0.045;
      controls.rotateSpeed = 0.42;
      controls.zoomSpeed = 0.62;
      controls.enablePan = false;
      controls.minDistance = 6.6;
      controls.maxDistance = 17;
      controls.minPolarAngle = Math.PI * 0.24;
      controls.maxPolarAngle = Math.PI * 0.52;
      controls.minAzimuthAngle = -Math.PI * 0.32;
      controls.maxAzimuthAngle = Math.PI * 0.32;
      controls.autoRotate = !reduceMotion;
      controls.autoRotateSpeed = 0.18;

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.82, 0.55, 0.72);
      composer.addPass(bloom);

      const clock = new THREE.Clock();
      const textureLoader = new THREE.TextureLoader();
      const saraTexture = textureLoader.load("/assets/img/birthday/sara-photo.jpg");
      saraTexture.colorSpace = THREE.SRGBColorSpace;

      let seed = 9041989;
      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      const material = {
        gold: new THREE.MeshPhysicalMaterial({
          color: 0xe9b95e,
          roughness: 0.18,
          metalness: 0.92,
          clearcoat: 1,
          clearcoatRoughness: 0.12,
        }),
        paleGold: new THREE.MeshPhysicalMaterial({
          color: 0xffe6a9,
          roughness: 0.22,
          metalness: 0.72,
          clearcoat: 0.75,
        }),
        ivory: new THREE.MeshPhysicalMaterial({
          color: 0xfff6e4,
          roughness: 0.31,
          metalness: 0.01,
          clearcoat: 0.64,
          clearcoatRoughness: 0.18,
        }),
        rose: new THREE.MeshPhysicalMaterial({
          color: 0xdd718e,
          roughness: 0.38,
          metalness: 0.04,
          clearcoat: 0.4,
        }),
        paleRose: new THREE.MeshStandardMaterial({ color: 0xffc3cd, roughness: 0.44 }),
        burgundy: new THREE.MeshStandardMaterial({ color: 0x681e38, roughness: 0.42 }),
        navyVelvet: new THREE.MeshStandardMaterial({ color: 0x101936, roughness: 0.72, metalness: 0.06 }),
        midnightMetal: new THREE.MeshStandardMaterial({ color: 0x10182b, roughness: 0.2, metalness: 0.86 }),
        marble: new THREE.MeshPhysicalMaterial({
          color: 0x8f9bab,
          roughness: 0.2,
          metalness: 0.18,
          clearcoat: 0.86,
          clearcoatRoughness: 0.14,
        }),
        glass: new THREE.MeshPhysicalMaterial({
          color: 0xd8edff,
          roughness: 0.04,
          transmission: 0.78,
          transparent: true,
          opacity: 0.36,
          metalness: 0,
          depthWrite: false,
        }),
        flame: new THREE.MeshBasicMaterial({ color: 0xfff2b1 }),
        leaf: new THREE.MeshStandardMaterial({ color: 0x1d5947, roughness: 0.56 }),
      };

      const flameMeshes = [];
      const twinkleMaterials = [];
      const fireworks = [];
      let wishEnergy = 0;

      function add(mesh, parent = scene, shadows = true) {
        if (shadows) {
          mesh.castShadow = true;
          mesh.receiveShadow = true;
        }
        parent.add(mesh);
        return mesh;
      }

      function cylinder(top, bottom, height, mat, segments = 80) {
        return new THREE.Mesh(new THREE.CylinderGeometry(top, bottom, height, segments), mat);
      }

      function createNightSky() {
        const starCount = 1500;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);
        const palette = [new THREE.Color(0x9abfff), new THREE.Color(0xffe1aa), new THREE.Color(0xffffff)];
        for (let i = 0; i < starCount; i += 1) {
          const radius = 34 + random() * 46;
          const theta = random() * Math.PI * 2;
          const phi = Math.acos(0.18 + random() * 0.82);
          positions[i * 3] = Math.sin(phi) * Math.cos(theta) * radius;
          positions[i * 3 + 1] = Math.abs(Math.cos(phi) * radius) + 5;
          positions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * radius - 18;
          const c = palette[Math.floor(random() * palette.length)];
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        const stars = new THREE.Points(
          geometry,
          new THREE.PointsMaterial({ size: 0.085, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.88 })
        );
        scene.add(stars);

        const moonGlow = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: radialTexture("#fff7d5", "rgba(147,181,255,.35)"), transparent: true, depthWrite: false })
        );
        moonGlow.position.set(12, 15, -28);
        moonGlow.scale.set(7, 7, 1);
        scene.add(moonGlow);
        const moon = new THREE.Mesh(new THREE.SphereGeometry(0.82, 48, 48), new THREE.MeshBasicMaterial({ color: 0xfff6d8 }));
        moon.position.set(12, 15, -28);
        scene.add(moon);
      }

      function radialTexture(inner, outer) {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient.addColorStop(0, inner);
        gradient.addColorStop(0.18, inner);
        gradient.addColorStop(1, outer);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createWindowTexture(rows, cols, hueShift = 0) {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 512;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#07101d";
        ctx.fillRect(0, 0, c.width, c.height);
        const gapX = c.width / cols;
        const gapY = c.height / rows;
        const tones = hueShift > 0.5 ? ["#ffd78b", "#f8c064", "#d7ecff"] : ["#91c9ff", "#f8d58d", "#d4e7ff"];
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            const lit = random() > 0.34;
            ctx.fillStyle = lit ? tones[Math.floor(random() * tones.length)] : "#0c1728";
            ctx.globalAlpha = lit ? 0.46 + random() * 0.54 : 0.52;
            ctx.fillRect(col * gapX + gapX * 0.22, row * gapY + gapY * 0.22, gapX * 0.5, gapY * 0.5);
          }
        }
        ctx.globalAlpha = 1;
        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.magFilter = THREE.NearestFilter;
        return texture;
      }

      function createBuilding(x, z, width, depth, height, style = 0) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);
        scene.add(group);
        const colors = [0x111a2d, 0x15223a, 0x1d2132, 0x0e2431, 0x211b30];
        const bodyMat = new THREE.MeshPhysicalMaterial({
          color: colors[style % colors.length],
          roughness: 0.32,
          metalness: 0.64,
          clearcoat: 0.3,
        });
        const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
        body.position.y = height / 2;
        add(body, group, false);

        const rows = Math.max(8, Math.floor(height * 2.4));
        const cols = Math.max(3, Math.floor(width * 3.5));
        const facadeMat = new THREE.MeshBasicMaterial({
          map: createWindowTexture(rows, cols, style / 5),
          transparent: true,
          opacity: 0.96,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        twinkleMaterials.push(facadeMat);
        const front = new THREE.Mesh(new THREE.PlaneGeometry(width * 0.92, height * 0.94), facadeMat);
        front.position.set(0, height / 2, depth / 2 + 0.012);
        group.add(front);
        const side = new THREE.Mesh(new THREE.PlaneGeometry(depth * 0.92, height * 0.94), facadeMat);
        side.position.set(width / 2 + 0.012, height / 2, 0);
        side.rotation.y = Math.PI / 2;
        group.add(side);

        if (style % 3 === 0) {
          const crown = cylinder(width * 0.34, width * 0.48, 0.42, material.midnightMetal, 6);
          crown.position.y = height + 0.21;
          add(crown, group, false);
        }
        if (style % 4 === 0) {
          const antenna = cylinder(0.018, 0.03, 1 + height * 0.08, material.paleGold, 12);
          antenna.position.y = height + 0.55;
          add(antenna, group, false);
        }
        return group;
      }

      function createSkyline() {
        const rows = [
          { z: -13.5, count: 18, spread: 35, hMin: 3.4, hMax: 8.6 },
          { z: -20.5, count: 23, spread: 48, hMin: 4.2, hMax: 12.4 },
          { z: -29, count: 27, spread: 62, hMin: 4.8, hMax: 15.8 },
        ];
        rows.forEach((row, rowIndex) => {
          for (let i = 0; i < row.count; i += 1) {
            const x = -row.spread / 2 + (i / (row.count - 1)) * row.spread + (random() - 0.5) * 1.1;
            if ((rowIndex === 1 && x < -7 && x > -12) || (rowIndex === 2 && Math.abs(x) < 2.2)) continue;
            const width = 0.72 + random() * 1.45;
            const depth = 0.72 + random() * 1.4;
            const height = row.hMin + random() * (row.hMax - row.hMin);
            createBuilding(x, row.z - random() * 2.5, width, depth, height, i + rowIndex);
          }
        });
        createOneWorldTower();
        createEmpireTower();
        createEiffelTower();
      }

      function createOneWorldTower() {
        const group = new THREE.Group();
        group.position.set(0.4, 0, -30);
        scene.add(group);
        const glass = new THREE.MeshPhysicalMaterial({ color: 0x193957, roughness: 0.12, metalness: 0.72, clearcoat: 0.8 });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.7, 11.5, 8), glass);
        base.position.y = 5.75;
        add(base, group, false);
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 1.15, 2.5, 8), glass);
        crown.position.y = 12.75;
        add(crown, group, false);
        const spire = cylinder(0.025, 0.12, 5.4, material.paleGold, 16);
        spire.position.y = 16.7;
        add(spire, group, false);
        for (let i = 0; i < 28; i += 1) {
          const y = 0.55 + i * 0.39;
          const ring = new THREE.Mesh(new THREE.TorusGeometry(1.18 - i * 0.008, 0.016, 6, 8), new THREE.MeshBasicMaterial({ color: i % 3 ? 0x83bfff : 0xffda8c }));
          ring.rotation.x = Math.PI / 2;
          ring.position.y = y;
          group.add(ring);
        }
      }

      function createEmpireTower() {
        const group = new THREE.Group();
        group.position.set(8.5, 0, -24);
        scene.add(group);
        const stone = new THREE.MeshStandardMaterial({ color: 0x333541, roughness: 0.44, metalness: 0.3 });
        const tiers = [
          [2.2, 2, 6.5, 3.25],
          [1.65, 1.55, 3.2, 8.1],
          [1.1, 1.05, 2.1, 10.75],
          [0.62, 0.6, 1.4, 12.5],
        ];
        tiers.forEach(([w, d, h, y]) => {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stone);
          mesh.position.y = y;
          add(mesh, group, false);
        });
        for (let y = 0.5; y < 12.8; y += 0.38) {
          const strip = new THREE.Mesh(new THREE.BoxGeometry(y > 7 ? 1.08 : 2.05, 0.035, 2.03), new THREE.MeshBasicMaterial({ color: y % 0.76 < 0.2 ? 0xffc66e : 0x92bfff }));
          strip.position.set(0, y, 0.02);
          group.add(strip);
        }
        const spire = cylinder(0.018, 0.13, 3.8, material.gold, 12);
        spire.position.y = 15.1;
        add(spire, group, false);
      }

      function tubeBetween(a, b, radius, mat, parent) {
        const delta = new THREE.Vector3().subVectors(b, a);
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, delta.length(), 10), mat);
        tube.position.copy(a).add(b).multiplyScalar(0.5);
        tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.clone().normalize());
        add(tube, parent, false);
        return tube;
      }

      function createEiffelTower() {
        const tower = new THREE.Group();
        tower.position.set(-9.5, 0, -21.5);
        tower.rotation.y = -0.08;
        scene.add(tower);
        const iron = new THREE.MeshStandardMaterial({ color: 0xd6a94f, roughness: 0.34, metalness: 0.86, emissive: 0x5b330b, emissiveIntensity: 0.35 });
        const levels = [
          { y: 0, half: 2.0 },
          { y: 2.1, half: 1.35 },
          { y: 5.2, half: 0.72 },
          { y: 8.4, half: 0.2 },
        ];
        const corners = [[-1,-1], [1,-1], [1,1], [-1,1]];
        for (let level = 0; level < levels.length - 1; level += 1) {

      function makeTextTexture(lines, width = 1024, height = 512) {
        const c = document.createElement("canvas");
        c.width = width;
        c.height = height;
        const ctx = c.getContext("2d");
        const bg = ctx.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, "#fffaf0");
        bg.addColorStop(0.52, "#f7ecdd");
        bg.addColorStop(1, "#efd9d7");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "#c99542";
        ctx.lineWidth = 9;
        ctx.strokeRect(34, 34, width - 68, height - 68);
        ctx.strokeStyle = "rgba(120,67,73,.55)";
        ctx.lineWidth = 2;
        ctx.strokeRect(57, 57, width - 114, height - 114);
        for (let i = 0; i < 16; i += 1) {
          const angle = (i / 16) * Math.PI * 2;
          ctx.fillStyle = i % 2 ? "#d7a852" : "#9a4962";
          ctx.beginPath();
          ctx.arc(width / 2 + Math.cos(angle) * (width * 0.42), height / 2 + Math.sin(angle) * (height * 0.37), 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        lines.forEach((line, index) => {
          ctx.fillStyle = line.color;
          ctx.font = line.font;
          ctx.fillText(line.text, width / 2, line.y);
        });
        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

          const theta = random() * Math.PI * 2;
          const phi = Math.acos(2 * random() - 1);
          const speed = 1.5 + random() * 2.5;
          velocities.push(new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta) * speed,
            Math.cos(phi) * speed,
            Math.sin(phi) * Math.sin(theta) * speed
          ));
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({ color, size: 0.1, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const points = new THREE.Points(geometry, mat);
        points.position.set(x, y, z);

        scene.add(points);
        fireworks.push(points);

        scene.add(pink);
        const cakeGlow = new THREE.PointLight(0xffc06f, 5.5, 10);
        cakeGlow.position.set(0.25, 4.2, 3.2);
        scene.add(cakeGlow);
      }

      createNightSky();
      createSkyline();
      createRooftop();
      createDiningTable();
      const cake = createCake();
      const card = createGreetingCard();
      createTableFlowers();
      createCandlestick(-2.45, -0.9, 1.2);
      createCandlestick(2.75, -0.92, 1.28);
      createCandlestick(-2.65, 1.05, 0.92);
      createCandlestick(2.84, 1.05, 1.02);
      const atmosphere = createAtmosphere();
      addFireworks();
      addLights();

      let idle = true;
      let lastInteraction = 0;
      controls.addEventListener("start", () => {
        idle = false;
        controls.autoRotate = false;
      });
      controls.addEventListener("end", () => {
        lastInteraction = performance.now();
      });

      wishButton.addEventListener("click", () => {
        wishEnergy = 1;
        bloom.strength = 1.28;
        wishButton.textContent = "Your wish is in the stars ✦";
        wishButton.disabled = true;
        window.setTimeout(() => {
          wishButton.disabled = false;
          wishButton.innerHTML = "Make another wish&nbsp; ✦";
        }, 5000);
      });

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        composer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        if (width < 720) {
          camera.position.set(0.3, 4.4, 14.8);
          controls.target.set(-0.15, 2.08, -0.1);
          controls.minDistance = 9.2;
          controls.maxDistance = 18;
          bloom.strength = 0.67;
        } else {
          camera.position.set(0.45, 4.15, 11.8);
          controls.target.set(0, 2.05, -0.2);
          controls.minDistance = 6.6;
          controls.maxDistance = 17;
          bloom.strength = 0.82;
        }
        controls.update();
      }

      window.addEventListener("resize", resize);
      resize();
      window.setTimeout(() => loader.classList.add("is-hidden"), 700);

      function updateFireworks(elapsed) {
        fireworks.forEach((firework) => {
          const boost = wishEnergy > 0.02 ? 0.8 : 0;
          const cycle = (elapsed + firework.userData.delay + boost) % 5.2;
          const active = cycle < firework.userData.duration;
          firework.material.opacity = active ? Math.max(0, 1 - cycle / firework.userData.duration) * (0.72 + boost * 0.35) : 0;
          if (!active) return;
          const positions = firework.geometry.attributes.position.array;
          firework.userData.velocities.forEach((velocity, index) => {
            const drag = 1 - cycle * 0.08;
            positions[index * 3] = velocity.x * cycle * drag;
            positions[index * 3 + 1] = velocity.y * cycle - 0.42 * cycle * cycle;
            positions[index * 3 + 2] = velocity.z * cycle * drag;
          });
          firework.geometry.attributes.position.needsUpdate = true;
        });
      }

      function animate() {
        const elapsed = clock.getElapsedTime();
        if (!idle && performance.now() - lastInteraction > 3500) {
          idle = true;
          controls.autoRotate = !reduceMotion;
        }
        flameMeshes.forEach(({ mesh, baseY, offset }, index) => {
          const flutter = Math.sin(elapsed * 8.5 + offset) * 0.07 + Math.sin(elapsed * 13 + index) * 0.025;
          mesh.scale.x = 0.67 + flutter;
          mesh.scale.z = 0.67 - flutter * 0.5;
          mesh.position.y = baseY + Math.sin(elapsed * 7 + offset) * 0.012;
          mesh.material.opacity = wishEnergy > 0.02 ? 0.18 + Math.sin(elapsed * 12 + index) * 0.06 : 1;
          mesh.material.transparent = true;
        });
        cake.rotation.y = Math.sin(elapsed * 0.32) * 0.035;
        card.position.y = Math.sin(elapsed * 0.55) * 0.018;
        const p = atmosphere.geometry.attributes.position;
        for (let i = 0; i < p.count; i += 1) {
          let y = p.getY(i) + 0.0025 + wishEnergy * 0.006;
          if (y > 9) y = 0.7;
          p.setY(i, y);
          p.setX(i, p.getX(i) + Math.sin(elapsed * 0.4 + i) * 0.0005);
        }
        p.needsUpdate = true;
        twinkleMaterials.forEach((mat, index) => {
          mat.opacity = 0.82 + Math.sin(elapsed * (0.4 + (index % 5) * 0.07) + index) * 0.14;
        });
        updateFireworks(elapsed);
        if (wishEnergy > 0) {
          wishEnergy *= 0.987;
          bloom.strength = THREE.MathUtils.lerp(0.82, 1.35, wishEnergy);
        }
        controls.update();
        composer.render();
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
