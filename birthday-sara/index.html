<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>happy birthday sara</title>
    <meta name="description" content="A VR-style 3D rooftop birthday cake for Sara.">
    <meta property="og:title" content="happy birthday sara">
    <meta property="og:description" content="A VR-style 3D rooftop birthday cake for Sara.">
    <meta property="og:image" content="https://sarasix.github.io/assets/img/birthday/rooftop-empty-vr.png">
    <meta property="og:type" content="website">
    <link rel="icon" href="/assets/img/birthday/sara-photo.jpg">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050914;
      }

      body {
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      body:active {
        cursor: grabbing;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <h1 class="sr-only">happy birthday sara</h1>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

      const canvas = document.querySelector("#scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x070d1e, 0.045);

      const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 120);
      camera.position.set(0.12, 2.35, 7.15);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.22, 0.22);
      controls.enableDamping = true;
      controls.dampingFactor = 0.055;
      controls.rotateSpeed = 0.54;
      controls.zoomSpeed = 0.72;
      controls.enablePan = false;
      controls.minDistance = 3.45;
      controls.maxDistance = 9.8;
      controls.minPolarAngle = Math.PI * 0.2;
      controls.maxPolarAngle = Math.PI * 0.59;

      const textureLoader = new THREE.TextureLoader();
      const rooftopTexture = textureLoader.load("/assets/img/birthday/rooftop-empty-vr.png");
      rooftopTexture.colorSpace = THREE.SRGBColorSpace;
      const saraTexture = textureLoader.load("/assets/img/birthday/sara-photo.jpg");
      saraTexture.colorSpace = THREE.SRGBColorSpace;

      const materials = {
        porcelain: new THREE.MeshPhysicalMaterial({
          color: 0xfff1dd,
          roughness: 0.32,
          metalness: 0.02,
          clearcoat: 0.5,
          clearcoatRoughness: 0.28,
        }),
        blush: new THREE.MeshPhysicalMaterial({
          color: 0xff9eb8,
          roughness: 0.38,
          metalness: 0.02,
          clearcoat: 0.32,
          clearcoatRoughness: 0.34,
        }),
        deepRose: new THREE.MeshStandardMaterial({
          color: 0xd84f76,
          roughness: 0.44,
          metalness: 0.02,
        }),
        paleRose: new THREE.MeshStandardMaterial({
          color: 0xffc0ce,
          roughness: 0.48,
          metalness: 0.01,
        }),
        cream: new THREE.MeshStandardMaterial({
          color: 0xfff7e9,
          roughness: 0.52,
          metalness: 0.01,
        }),
        gold: new THREE.MeshPhysicalMaterial({
          color: 0xf9ca69,
          roughness: 0.18,
          metalness: 0.9,
          clearcoat: 0.8,
          clearcoatRoughness: 0.16,
        }),
        darkGold: new THREE.MeshStandardMaterial({
          color: 0xa36b2a,
          roughness: 0.28,
          metalness: 0.82,
        }),
        flame: new THREE.MeshBasicMaterial({ color: 0xfff0a6 }),
        chocolate: new THREE.MeshStandardMaterial({
          color: 0x6e4334,
          roughness: 0.36,
          metalness: 0.04,
        }),
        marble: new THREE.MeshPhysicalMaterial({
          color: 0xbac4d7,
          roughness: 0.22,
          metalness: 0.16,
          clearcoat: 0.65,
          clearcoatRoughness: 0.22,
        }),
        glass: new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          roughness: 0.08,
          transmission: 0.18,
          transparent: true,
          opacity: 0.38,
          metalness: 0,
        }),
      };

      function add(mesh, parent = scene) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      function makeCylinder(radiusTop, radiusBottom, height, material, segments = 128) {
        return new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 3), material);
      }

      function roundedPlate(radius, y, height, material, parent) {
        const plate = makeCylinder(radius, radius * 1.02, height, material, 160);
        plate.position.y = y;
        add(plate, parent);
        const lip = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.02, height * 0.34, 18, 160), material);
        lip.position.y = y + height * 0.48;
        lip.rotation.x = Math.PI / 2;
        add(lip, parent);
        return plate;
      }

      function backdrop() {
        scene.background = new THREE.Color(0x071022);

        const bg = new THREE.Mesh(
          new THREE.CylinderGeometry(15, 15, 10, 160, 1, true),
          new THREE.MeshBasicMaterial({ map: rooftopTexture, side: THREE.BackSide })
        );
        bg.position.set(0, 3.6, 0.6);
        bg.rotation.y = Math.PI * 1.5;
        scene.add(bg);

        const skyGlow = new THREE.Mesh(
          new THREE.SphereGeometry(32, 48, 24),
          new THREE.MeshBasicMaterial({
            color: 0x10224f,
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.42,
          })
        );
        skyGlow.position.y = 2.5;
        scene.add(skyGlow);

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(42, 32),
          materials.marble
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, -0.08, 2.2);
        floor.receiveShadow = true;
        scene.add(floor);

        const floorGrid = new THREE.GridHelper(34, 30, 0xefd68a, 0x304363);
        floorGrid.position.y = -0.071;
        floorGrid.material.transparent = true;
        floorGrid.material.opacity = 0.16;
        scene.add(floorGrid);

        const railMaterial = new THREE.MeshStandardMaterial({
          color: 0xd6c1a2,
          roughness: 0.32,
          metalness: 0.14,
        });
        const rail = new THREE.Mesh(new THREE.BoxGeometry(22, 0.14, 0.15), railMaterial);
        rail.position.set(0, 1.16, -4.75);
        add(rail);
        for (let i = 0; i < 22; i += 1) {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.055, 1.15, 16), railMaterial);
          post.position.set(-10.5 + i, 0.5, -4.75);
          add(post);
        }

        const loungeLight = new THREE.Mesh(
          new THREE.TorusGeometry(4.4, 0.01, 8, 160),
          new THREE.MeshBasicMaterial({ color: 0xffdda0, transparent: true, opacity: 0.48 })
        );
        loungeLight.rotation.x = Math.PI / 2;
        loungeLight.position.set(0, 0.006, 0.58);
        scene.add(loungeLight);
      }

      function addLights() {
        const hemi = new THREE.HemisphereLight(0xf8eacb, 0x17274f, 1.35);
        scene.add(hemi);

        const moon = new THREE.DirectionalLight(0x9ec8ff, 1.4);
        moon.position.set(-6, 9, -3);
        moon.castShadow = true;
        moon.shadow.mapSize.set(2048, 2048);
        moon.shadow.camera.near = 0.5;
        moon.shadow.camera.far = 30;
        moon.shadow.camera.left = -8;
        moon.shadow.camera.right = 8;
        moon.shadow.camera.top = 8;
        moon.shadow.camera.bottom = -8;
        scene.add(moon);

        const candleGlow = new THREE.PointLight(0xffbd67, 9.5, 16);
        candleGlow.position.set(0.2, 2.6, 1.7);
        scene.add(candleGlow);

        const roseGlow = new THREE.PointLight(0xff7fa5, 2.7, 10);
        roseGlow.position.set(2.4, 1.5, 2.8);
        scene.add(roseGlow);

        const cardGlow = new THREE.PointLight(0xffd38a, 2.3, 8);
        cardGlow.position.set(-3.25, 1.65, 1.9);
        scene.add(cardGlow);
      }

      function createCake() {
        const cake = new THREE.Group();
        cake.position.set(0, 0, 0.58);
        scene.add(cake);

        roundedPlate(2.45, 0.02, 0.2, materials.gold, cake);
        roundedPlate(2.25, 0.19, 0.16, materials.marble, cake);

        const tiers = [
          { r: 1.86, h: 0.72, y: 0.64, mat: materials.porcelain },
          { r: 1.28, h: 0.68, y: 1.32, mat: materials.blush },
          { r: 0.82, h: 0.64, y: 1.96, mat: materials.porcelain },
        ];

        tiers.forEach((tier) => {
          const mesh = makeCylinder(tier.r, tier.r * 1.015, tier.h, tier.mat, 192);
          mesh.position.y = tier.y;
          add(mesh, cake);
          const top = new THREE.Mesh(new THREE.TorusGeometry(tier.r * 0.99, 0.045, 20, 192), materials.cream);
          top.position.y = tier.y + tier.h * 0.5 + 0.02;
          top.rotation.x = Math.PI / 2;
          add(top, cake);
          const bottom = new THREE.Mesh(new THREE.TorusGeometry(tier.r * 1.01, 0.05, 20, 192), materials.cream);
          bottom.position.y = tier.y - tier.h * 0.5 + 0.02;
          bottom.rotation.x = Math.PI / 2;
          add(bottom, cake);
        });

        addPearls(cake, 1.93, 0.29, 66, 0.057);
        addPearls(cake, 1.31, 0.98, 52, 0.048);
        addPearls(cake, 0.85, 1.67, 38, 0.043);
        addLattice(cake, 1.32, 1.32, 0.7);
        addGoldDrips(cake, 0.82, 2.27, 26);
        addGoldDrips(cake, 1.28, 1.67, 34);
        addIcingPuffs(cake, 1.88, 0.31, 50, 0.13);
        addIcingPuffs(cake, 1.3, 1, 42, 0.105);
        addIcingPuffs(cake, 0.84, 1.68, 32, 0.09);

        const roseSpots = [
          [1.32, 0.48, 1.18, 0.22, materials.deepRose],
          [-1.25, 0.53, 1.02, 0.2, materials.paleRose],
          [0.76, 1.17, 0.96, 0.18, materials.deepRose],
          [-0.6, 1.84, 0.6, 0.15, materials.paleRose],
          [0.22, 2.31, 0.14, 0.17, materials.deepRose],
          [-0.2, 2.32, 0.1, 0.15, materials.paleRose],
          [0.46, 2.27, 0.08, 0.14, materials.paleRose],
        ];
        roseSpots.forEach(([x, y, z, scale, material], index) => {
          const rose = createRose(scale, material);
          rose.position.set(x, y, z);
          rose.rotation.y = -0.35 + index * 0.28;
          cake.add(rose);
        });

        addCandles(cake);

        return cake;
      }

      function addPearls(parent, radius, y, count, size) {
        const geometry = new THREE.SphereGeometry(size, 18, 18);
        for (let i = 0; i < count; i += 1) {
          const angle = (i / count) * Math.PI * 2;
          const pearl = new THREE.Mesh(geometry, i % 5 === 0 ? materials.gold : materials.cream);
          pearl.position.set(Math.cos(angle) * radius, y + Math.sin(i * 1.7) * 0.006, Math.sin(angle) * radius);
          add(pearl, parent);
        }
      }

      function addIcingPuffs(parent, radius, y, count, size) {
        for (let i = 0; i < count; i += 1) {
          const angle = (i / count) * Math.PI * 2;
          const puff = new THREE.Mesh(new THREE.SphereGeometry(size, 18, 18), materials.cream);
          puff.scale.set(1.25, 0.58, 0.92);
          puff.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
          puff.rotation.y = -angle;
          add(puff, parent);
        }
      }

      function addGoldDrips(parent, radius, topY, count) {
        for (let i = 0; i < count; i += 1) {
          const angle = (i / count) * Math.PI * 2;
          const length = 0.12 + Math.random() * 0.28;
          const drop = new THREE.Mesh(new THREE.CapsuleGeometry(0.018 + Math.random() * 0.014, length, 8, 16), materials.gold);
          drop.position.set(Math.cos(angle) * radius, topY - length * 0.48, Math.sin(angle) * radius);
          drop.rotation.z = Math.PI;
          add(drop, parent);
          const bead = new THREE.Mesh(new THREE.SphereGeometry(0.028, 14, 14), materials.gold);
          bead.position.set(Math.cos(angle) * radius, topY - length, Math.sin(angle) * radius);
          add(bead, parent);
        }
      }

      function addLattice(parent, radius, centerY, height) {
        const lineMaterial = new THREE.MeshStandardMaterial({
          color: 0xf6d27d,
          roughness: 0.25,
          metalness: 0.8,
        });

        for (let dir = -1; dir <= 1; dir += 2) {
          for (let i = 0; i < 18; i += 1) {
            const points = [];
            for (let step = 0; step <= 36; step += 1) {
              const t = step / 36;
              const angle = (i / 18) * Math.PI * 2 + dir * (t - 0.5) * 0.82;
              const y = centerY - height * 0.33 + t * height * 0.66;
              points.push(new THREE.Vector3(Math.cos(angle) * (radius + 0.018), y, Math.sin(angle) * (radius + 0.018)));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 36, 0.0085, 8, false), lineMaterial);
            add(tube, parent);
          }
        }
      }

      function createRose(scale, material) {
        const rose = new THREE.Group();
        const center = new THREE.Mesh(new THREE.SphereGeometry(scale * 0.24, 18, 18), material);
        center.scale.y = 0.65;
        add(center, rose);

        for (let ring = 0; ring < 3; ring += 1) {
          const petals = 7 + ring * 4;
          for (let i = 0; i < petals; i += 1) {
            const angle = (i / petals) * Math.PI * 2 + ring * 0.28;
            const petal = new THREE.Mesh(new THREE.SphereGeometry(scale * (0.24 + ring * 0.05), 18, 12), material);
            petal.scale.set(0.5, 0.13, 0.88);
            petal.position.set(
              Math.cos(angle) * scale * (0.2 + ring * 0.18),
              ring * scale * 0.045,
              Math.sin(angle) * scale * (0.2 + ring * 0.18)
            );
            petal.rotation.set(0.55, -angle, 0.18);
            add(petal, rose);
          }
        }

        return rose;
      }

      function addCandles(parent) {
        const stripeMaterial = new THREE.MeshStandardMaterial({
          color: 0xff9ebb,
          roughness: 0.32,
          metalness: 0.03,
        });
        const candlePositions = [
          [-0.48, 2.52, 0.13],
          [-0.25, 2.56, 0.08],
          [0, 2.58, 0.05],
          [0.25, 2.56, 0.08],
          [0.48, 2.52, 0.13],
          [-0.16, 2.55, -0.2],
          [0.16, 2.55, -0.2],
        ];

        candlePositions.forEach(([x, y, z], index) => {
          const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.55, 28), materials.cream);
          candle.position.set(x, y, z);
          add(candle, parent);

          for (let stripe = 0; stripe < 3; stripe += 1) {
            const band = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.0045, 8, 24), stripeMaterial);
            band.position.set(x, y - 0.17 + stripe * 0.16, z);
            band.rotation.x = Math.PI / 2;
            band.rotation.z = (stripe + index) * 0.4;
            add(band, parent);
          }

          const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.085, 8), materials.chocolate);
          wick.position.set(x, y + 0.315, z);
          add(wick, parent);

          const flame = new THREE.Mesh(new THREE.SphereGeometry(0.052, 18, 18), materials.flame);
          flame.position.set(x, y + 0.39, z);
          flame.scale.set(0.72, 1.7, 0.72);
          parent.add(flame);

          const glow = new THREE.PointLight(0xffbd67, 0.75, 1.4);
          glow.position.copy(flame.position);
          parent.add(glow);
        });
      }

      function createTextTexture() {
        const textCanvas = document.createElement("canvas");
        textCanvas.width = 1024;
        textCanvas.height = 512;
        const ctx = textCanvas.getContext("2d");
        ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);
        ctx.fillStyle = "rgba(255, 250, 240, 0.98)";
        ctx.fillRect(0, 0, textCanvas.width, textCanvas.height);

        const gradient = ctx.createLinearGradient(0, 0, 1024, 512);
        gradient.addColorStop(0, "#fff6dc");
        gradient.addColorStop(0.45, "#f7c96a");
        gradient.addColorStop(1, "#ff8fb8");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, textCanvas.width, 18);
        ctx.fillRect(0, textCanvas.height - 18, textCanvas.width, 18);

        ctx.fillStyle = "#4c2d20";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 78px Inter, Arial, sans-serif";
        ctx.fillText("happy birthday", 512, 170);
        ctx.font = "900 98px Inter, Arial, sans-serif";
        ctx.fillText("sara", 512, 280);

        ctx.strokeStyle = "rgba(247, 201, 106, 0.72)";
        ctx.lineWidth = 8;
        ctx.strokeRect(38, 38, 948, 436);

        const texture = new THREE.CanvasTexture(textCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createSideTable() {
        const table = new THREE.Group();
        table.position.set(-3.35, 0.04, 1.45);
        table.rotation.y = 0.22;
        scene.add(table);

        const wood = new THREE.MeshStandardMaterial({
          color: 0x76513c,
          roughness: 0.34,
          metalness: 0.08,
        });
        const top = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 0.9, 0.1, 80), wood);
        top.position.y = 0.7;
        add(top, table);
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 0.08, 48), materials.gold);
        base.position.y = 0.03;
        add(base, table);
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.085, 0.7, 32), materials.gold);
        leg.position.y = 0.35;
        add(leg, table);

        const card = new THREE.Group();
        card.position.set(-0.08, 1.28, 0.08);
        card.rotation.x = -0.08;
        card.rotation.y = 0.12;
        table.add(card);

        const cardBack = new THREE.Mesh(
          new THREE.BoxGeometry(1.45, 1.18, 0.045),
          new THREE.MeshPhysicalMaterial({
            color: 0xfff4dd,
            roughness: 0.28,
            metalness: 0.02,
            clearcoat: 0.35,
          })
        );
        add(cardBack, card);

        const textPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(1.28, 0.64),
          new THREE.MeshBasicMaterial({ map: createTextTexture(), transparent: true })
        );
        textPlane.position.set(0, 0.28, 0.028);
        card.add(textPlane);

        const photo = new THREE.Mesh(
          new THREE.PlaneGeometry(0.54, 0.54),
          new THREE.MeshBasicMaterial({ map: saraTexture })
        );
        photo.position.set(0, -0.31, 0.032);
        card.add(photo);

        const photoFrame = new THREE.Mesh(new THREE.TorusGeometry(0.39, 0.025, 16, 80), materials.gold);
        photoFrame.scale.y = 0.72;
        photoFrame.position.set(0, -0.31, 0.038);
        card.add(photoFrame);

        const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.32, 20), materials.cream);
        candle.position.set(0.58, 0.93, 0.4);
        add(candle, table);
        const flame = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), materials.flame);
        flame.scale.y = 1.6;
        flame.position.set(0.58, 1.13, 0.4);
        table.add(flame);
      }

      function addFloatingConfetti() {
        const confetti = [];
        const colors = [0xf7c96a, 0xff8fb8, 0xffffff, 0x77dfff, 0xff5f86];
        for (let i = 0; i < 170; i += 1) {
          const material = new THREE.MeshBasicMaterial({
            color: colors[i % colors.length],
            side: THREE.DoubleSide,
          });
          const piece = new THREE.Mesh(new THREE.PlaneGeometry(0.035 + Math.random() * 0.035, 0.1 + Math.random() * 0.08), material);
          piece.position.set((Math.random() - 0.5) * 12, 1 + Math.random() * 7, -3 + Math.random() * 8);
          piece.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          piece.userData.speed = 0.002 + Math.random() * 0.006;
          piece.userData.spin = 0.01 + Math.random() * 0.025;
          confetti.push(piece);
          scene.add(piece);
        }
        return confetti;
      }

      function addBalloons() {
        const balloons = [];
        const mats = [
          new THREE.MeshPhysicalMaterial({ color: 0xf7c96a, roughness: 0.14, metalness: 0.45, clearcoat: 0.8 }),
          new THREE.MeshPhysicalMaterial({ color: 0xff8fb8, roughness: 0.18, metalness: 0.28, clearcoat: 0.75 }),
          new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.12, metalness: 0.24, clearcoat: 0.82 }),
        ];
        const positions = [
          [-5.5, 3.2, 0.4],
          [-5.95, 2.65, 0.6],
          [-5.25, 2.55, 0.7],
          [5.4, 3.25, -0.3],
          [5.82, 2.62, -0.1],
          [5.1, 2.72, 0.08],
        ];
        positions.forEach((position, index) => {
          const balloon = new THREE.Mesh(new THREE.SphereGeometry(0.26, 36, 36), mats[index % mats.length]);
          balloon.scale.y = 1.18;
          balloon.position.fromArray(position);
          balloons.push(balloon);
          add(balloon);
        });
        return balloons;
      }

      backdrop();
      addLights();
      const cake = createCake();
      createSideTable();
      const confetti = addFloatingConfetti();
      const balloons = addBalloons();

      let idleSpin = true;
      controls.addEventListener("start", () => {
        idleSpin = false;
      });
      controls.addEventListener("end", () => {
        window.setTimeout(() => {
          idleSpin = true;
        }, 1200);
      });

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        if (width < 720) {
          camera.position.set(0.08, 2.35, 7.9);
          controls.target.set(0, 1.34, 0.42);
        } else {
          camera.position.set(0.12, 2.35, 7.15);
          controls.target.set(0, 1.22, 0.22);
        }
        controls.update();
      }

      window.addEventListener("resize", resize);
      resize();

      function animate(now) {
        const time = now * 0.001;
        if (idleSpin) {
          cake.rotation.y += 0.0022;
        }

        confetti.forEach((piece, index) => {
          piece.position.y -= piece.userData.speed;
          piece.rotation.x += piece.userData.spin;
          piece.rotation.y += piece.userData.spin * 0.7;
          piece.position.x += Math.sin(time + index) * 0.0015;
          if (piece.position.y < -0.4) {
            piece.position.y = 7.2 + Math.random() * 1.2;
            piece.position.x = (Math.random() - 0.5) * 12;
            piece.position.z = -3 + Math.random() * 8;
          }
        });

        balloons.forEach((balloon, index) => {
          balloon.position.y += Math.sin(time * 1.2 + index) * 0.0018;
          balloon.rotation.z = Math.sin(time * 0.8 + index) * 0.035;
        });

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
